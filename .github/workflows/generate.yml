name: Generate Data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Which source to generate
        required: true
        default: all
        type: choice
        options:
          - all
          - netease
          - steam
          - github
          - bangumi
          # - bilibili
  schedule:
    - cron: '0 0 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: pnpm i

      - name: Generate netease data
        if: ${{ github.event.inputs.source == 'netease' || github.event.inputs.source == 'all' || github.event_name != 'workflow_dispatch' }}
        run: npm run generate:netease
        env:
          NETEASE_ID: ${{ secrets.NETEASE_ID }}
          NETEASE_FAVORITE_ID: ${{ secrets.NETEASE_FAVORITE_ID }}

      - name: Generate steam data
        if: ${{ github.event.inputs.source == 'steam' || github.event.inputs.source == 'all' || github.event_name != 'workflow_dispatch' }}
        run: npm run generate:steam
        env:
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_KEY: ${{ secrets.STEAM_KEY }}
          STEAM_GAMES_EXCLUDE: ${{ secrets.STEAM_GAMES_EXCLUDE }}

      - name: Generate github data
        if: ${{ github.event.inputs.source == 'github' || github.event.inputs.source == 'all' || github.event_name != 'workflow_dispatch' }}
        run: npm run generate:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}

      - name: Generate bangumi data
        if: ${{ github.event.inputs.source == 'bangumi' || github.event.inputs.source == 'all' || github.event_name != 'workflow_dispatch' }}
        run: npm run generate:bangumi
        env:
          BANGUMI_ID: ${{ secrets.BANGUMI_ID }}
          BANGUMI_USER_AGENT: ${{ secrets.BANGUMI_USER_AGENT }}

      # - name: Generate bilibili data
      #   if: ${{ github.event.inputs.source == 'bilibili' || github.event.inputs.source == 'all' || github.event_name != 'workflow_dispatch' }}
      #   run: npm run generate:bilibili

      - name: Record base sha
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          add: data/*
          message: "chore: update ${{ github.event.inputs.source == 'all' && 'all' || github.event.inputs.source }} data"
          author_name: GitHub Actions
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge jsDelivr cache
        run: |
          # jsDelivr caches @main for 12h; clear it after the commit so the blog sees fresh data
          BASE="${{ steps.base.outputs.sha }}"
          purge() {
            echo "purging $1"
            curl -fsS --retry 3 --max-time 30 "https://purge.jsdelivr.net/gh/Lu-Jiejie/static@main/$1" > /dev/null \
              && echo "  ok" || echo "  failed"
          }

          # 根路径兜底：任何 data/ 下的新文件都能被刷掉
          purge ""

          # 本次真正改动过的文件逐个刷
          CHANGED=$(git diff --name-only "$BASE" HEAD -- data/ || true)
          if [ -z "$CHANGED" ]; then
            echo "no data files changed, nothing to purge"
            exit 0
          fi

          echo "$CHANGED" | while read -r path; do
            if [ -n "$path" ]; then
              purge "$path"
            fi
          done

          # 封面有变动时把整个目录也刷一次，避免残留旧图
          if echo "$CHANGED" | grep -q '^data/steam/covers/'; then
            purge "data/steam/covers/"
          fi
